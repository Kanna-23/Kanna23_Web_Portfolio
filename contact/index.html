<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Kanna23</title>
  <meta name="description" content="Get in touch with Kanna23, 3D artist.">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico">

  <!-- Google Fonts : Fraunces (titres), Limelight (titres décoratifs), Inter (texte courant) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Limelight&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="/" class="logo">
        <img src="/images/logo.png" alt="Kanna23">
      </a>

      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mainNav">
        Menu
      </button>

      <nav class="main-nav" id="mainNav">
        <a href="/projects">Projects</a>
        <a href="/contact">Contact</a>

        <div class="lang-switch">
          <label for="lang" class="sr-only">Select language</label>
          <select id="lang">
            <option value="en" selected>English</option>
            <option value="fr">Français</option>
          </select>
        </div>
      </nav>

    </div>
  </header>

  <main>

    <!-- ===== EN-TETE DE PAGE ===== -->
    <section class="contact-hero container">
      <h1>Contact</h1>
    </section>

    <section class="para">
       <p>Contact me through my various social media channels or directly by email.</p>
    </section>

    <!-- ===== FORMULAIRE + COORDONNEES ===== -->
    <section class="contact-grid container">

      <!-- Formulaire relié à Web3Forms (aucun serveur nécessaire, compatible GitHub Pages) -->
      <form id="contactForm" class="contact-form">

        <!-- Remplace cette valeur par ta propre clé Web3Forms (voir instructions fournies) -->
        <input type="hidden" name="access_key" value="6eca85d7-3359-4b93-9022-4998ac68ba67">

        <!-- Piège à robots, doit rester invisible et vide -->
        <input type="checkbox" name="botcheck" class="hidden-field" tabindex="-1" autocomplete="off">

        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn" id="submitBtn">Send message</button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <!-- Coordonnées directes, en complément du formulaire -->
     
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-credit">Designed by Kanna23</p>

      <div class="social-links">
        <a href="https://www.linkedin.com/in/karelsissung/" target="_blank" rel="noopener">Linkedin</a>
        <a href="https://www.artstation.com/karelsissung30250" target="_blank" rel="noopener">ArtStation</a>
        <a href="https://www.instagram.com/kanna23_3d/?igsh=NnUzc3Y3dm12dWF2&utm_source=qr" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
